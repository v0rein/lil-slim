name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Bare `node --test` discovers test/*.test.mjs on every Node version;
      # `node --test test/` is treated as a module path on Node 22.
      - run: node --test

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests
        working-directory: hooks/rust
        run: cargo test
      - name: Build release binary
        working-directory: hooks/rust
        run: cargo build --release
      - name: Parity with the Node hooks
        shell: bash
        run: |
          BIN="hooks/rust/target/release/lil-hook"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          node hooks/rust/parity.mjs "$PWD" "$PWD/$BIN"

  # Runs the COMMITTED binaries (what users actually get) natively on each
  # platform: parity with the Node hooks, and a full hook round trip through
  # run.sh with node removed from PATH.
  committed-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-24.04, exe: lil-hook }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, exe: lil-hook }
          - { platform: darwin-arm64, os: macos-15, exe: lil-hook }
          - { platform: darwin-x64, os: macos-15-intel, exe: lil-hook }
          - { platform: windows-x64, os: windows-latest, exe: lil-hook.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checksums match
        shell: bash
        working-directory: hooks/bin
        run: |
          if command -v sha256sum >/dev/null; then grep " ${{ matrix.platform }}/" SHA256SUMS | sha256sum -c -;
          else grep " ${{ matrix.platform }}/" SHA256SUMS | shasum -a 256 -c -; fi
      - name: Parity with the Node hooks
        shell: bash
        run: node hooks/rust/parity.mjs "$PWD" "$PWD/hooks/bin/${{ matrix.platform }}/${{ matrix.exe }}"
      - name: Prove run.sh uses the binary and not node
        shell: bash
        run: |
          ROOT="$PWD"
          PLAT="${{ matrix.platform }}"
          IN='{"hook_event_name":"SessionStart","agent_type":"lil-slim:orchestrator"}'
          # A fake node that wins PATH lookup and prints a marker. If run.sh ever
          # runs node, the marker shows up instead of the real hook output.
          SHIM="$(mktemp -d)"
          printf '%s\n' '#!/bin/sh' 'printf NODE-RAN' > "$SHIM/node"
          chmod +x "$SHIM/node"
          [ "$(PATH="$SHIM:$PATH" command -v node)" = "$SHIM/node" ] || { echo "shim does not win lookup"; exit 1; }
          OUT="$(printf '%s' "$IN" | PATH="$SHIM:$PATH" sh "$ROOT/hooks/scripts/run.sh" phase-reminder)"
          case "$OUT" in
            *NODE-RAN*) echo "run.sh used node instead of the binary: [$OUT]"; exit 1 ;;
            *"Scheduler workflow"*) echo "ok, binary output: $(printf '%s' "$OUT" | head -c 80)" ;;
            *) echo "unexpected output: [$OUT]"; exit 1 ;;
          esac
          # and the fallback chain is live: without the binary, the shim is reached
          mv "$ROOT/hooks/bin/$PLAT" "$ROOT/hooks/bin/$PLAT.off"
          OUT2="$(printf '%s' "$IN" | PATH="$SHIM:$PATH" sh "$ROOT/hooks/scripts/run.sh" phase-reminder)"
          mv "$ROOT/hooks/bin/$PLAT.off" "$ROOT/hooks/bin/$PLAT"
          [ "$OUT2" = "NODE-RAN" ] || { echo "fallback did not reach node: [$OUT2]"; exit 1; }
          echo "ok, fallback reaches node when the binary is absent"
